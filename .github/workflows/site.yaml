name: Deploy Site
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v12
        with:
          # Needs late 3.1.x: emscripten 4+ rejects the
          # EXTRA_EXPORTED_RUNTIME_METHODS flag sqlite-src-3440000's wasm build
          # passes, while pre-3.1.65 wasm-opt lacks --enable-bulk-memory-opt,
          # which current stable rustc emits
          version: "3.1.74"
      - run: make site
      - uses: actions/configure-pages@v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
